# DevSecOps Workflow Definition
# This workflow is triggered on every push to the repository
name: DevGuard-Web-Workflow

on:
  workflow_dispatch:
  push:

permissions:
  contents: read
  packages: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run jest tests
        run: npm test -- --ci

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # npm run lint passes --max-warnings=0, so warnings fail the build too
      - name: Run eslint
        run: npm run lint

  dead-code:
    name: Dead Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run knip
        run: npm run knip

  code-scanning:
    uses: l3montree-dev/devguard-ci-components/.github/workflows/code-scanning.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      devguard-asset-name: l3montree-cybersecurity/projects/devguard/assets/devguard-web
      devguard-api-url: https://api.main.devguard.org
      fail-on-risk: high
      fail-on-cvss: high
      devguard-web-ui: https://main.devguard.org
      allow-failure: false
    secrets:
      devguard-token: ${{ secrets.DEVGUARD_TOKEN }}

  upload-sourcemaps:
    name: Upload Source Maps
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    needs: web-pipeline
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 #v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://nix.garage.l3montree.cloud
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix.garage.l3montree.cloud:MGlzfPQKA91/zxw91CN+GP7NpjAAwmKvWXlDYgeeI8k=

      - name: Build web artifacts
        run: nix build .#default --impure --print-build-logs

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '26'

      - name: Stage build output
        run: |
          mkdir -p sourcemaps
          cp -rL result/.next/static sourcemaps/static
          cp -rL result/.next/server sourcemaps/server
          chmod -R u+w sourcemaps

      - name: Determine release
        id: release
        run: |
          BAKED="$(cat result/.next/RELEASE)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            EXPECTED="$GITHUB_REF_NAME"
          else
            EXPECTED="main"
          fi
          if [ "$BAKED" != "$EXPECTED" ]; then
            echo "::error::bundle baked release '$BAKED' but ref implies '$EXPECTED' — source maps would not match reported events."
            exit 1
          fi
          echo "name=$BAKED" >> "$GITHUB_OUTPUT"
          echo "release: $BAKED"

      - name: Upload source maps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_URL: https://error-tracking.devguard.org/
          SENTRY_ORG: devguard
          SENTRY_PROJECT: devguard-web
        run: |
          npx --yes @sentry/cli@3.6.2 sourcemaps upload \
            --release "${{ steps.release.outputs.name }}" \
            ./sourcemaps

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get minor version
        id: tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          MINOR=$(echo "${TAG#v}" | cut -d. -f1-2)
          echo "minor=${MINOR}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "DevGuard Web ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'test-') || contains(steps.tag.outputs.tag, '-rc') || contains(steps.tag.outputs.tag, '-alpha') || contains(steps.tag.outputs.tag, '-beta') }}
          body: |
            # DevGuard Web ${{ steps.tag.outputs.tag }}

            Frontend web application for the DevGuard platform.

            ### 🐳 Container Image

            ```bash
            docker pull ghcr.io/l3montree-dev/devguard-web:${{ steps.tag.outputs.tag }}
            ```

            ---

            ## Versioning

            All DevGuard components (`devguard`, `devguard-web`, Helm chart) share the same **minor version**. Any `v${{ steps.tag.outputs.minor }}.*` release of one component is compatible with any `v${{ steps.tag.outputs.minor }}.*` release of another. Patch versions are released independently per component — you do not need to upgrade all components simultaneously as long as the minor version matches.

            📖 See [VERSIONING.md](https://github.com/l3montree-dev/devguard/blob/main/VERSIONING.md) for the full policy.
            📋 [Web CHANGELOG](https://github.com/l3montree-dev/devguard-web/blob/main/CHANGELOG.md) — frontend changes in this release.
            📋 [DevGuard CHANGELOG](https://github.com/l3montree-dev/devguard/blob/main/CHANGELOG.md) — API and backend changes.

            ---

            🐛 Report Issues: https://github.com/l3montree-dev/devguard/issues
            💬 Community: https://github.com/l3montree-dev/devguard/discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-pipeline:
    uses: l3montree-dev/devguard-ci-components/.github/workflows/full-nix.yml@main
    permissions:
      contents: read
      packages: write
      security-events: write
    with:
      nix-target-amd64: devguard-web-amd64
      nix-target-arm64: devguard-web-arm64
      nix-version: '2.34.4'
      # flake.nix reads the git ref to bake NEXT_PUBLIC_VERSION for source maps
      nix-impure: 'true'
      image-name: ghcr.io/${{ github.repository }}
      devguard-asset-name: l3montree-cybersecurity/projects/devguard/assets/devguard-web
      devguard-api-url: https://api.main.devguard.org
      devguard-web-ui: https://main.devguard.org
      fail-on-cvss: high
      fail-on-risk: high
      nix-cache-substituter: https://nix.garage.l3montree.cloud
      nix-cache-public-key: nix.garage.l3montree.cloud:MGlzfPQKA91/zxw91CN+GP7NpjAAwmKvWXlDYgeeI8k=
      nix-cache-s3-bucket: nix
      nix-cache-region: garage
    secrets:
      devguard-token: ${{ secrets.DEVGUARD_TOKEN }}
