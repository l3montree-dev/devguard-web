name: E2E Tests

on:
  workflow_dispatch:
  push:

permissions: read-all

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - name: Start backend services
        working-directory: .github/e2e
        run: docker compose up -d

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create frontend .env
        run: |
          cat > .env << 'EOF'
          ORY_SDK_URL=http://localhost:4433
          ORY_SDK_PUBLIC_URL=http://localhost:3000
          DEVGUARD_API_URL=http://localhost:8080
          DEVGUARD_API_URL_PUBLIC_INTERNET=http://localhost:8080
          FRONTEND_URL=http://localhost:3000
          REGISTRATION_ENABLED=true
          DEVGUARD_DOMAIN=http://localhost:3000
          DEVGUARD_EMAIL_LOGIN_USERNAME=test-user-XXX
          DEVGUARD_EMAIL_LOGIN_PASSWORD=Test1234!secure
          OPEN_CODE_USERNAME=placeholder
          OPEN_CODE_PASSWORD=placeholder
          OPEN_CODE_TOTP_SECRET=placeholder
          EOF

      - name: Build frontend
        run: NEXT_TELEMETRY_DISABLED=1 E2E_TESTS=true npm run build

      - name: Start frontend
        run: NEXT_TELEMETRY_DISABLED=1 E2E_TESTS=true npm run start &

      - name: Wait for kratos to be ready
        run: |
          echo "Waiting for kratos..."
          timeout 120 bash -c 'until curl -sf http://localhost:4434/admin/health/alive > /dev/null 2>&1; do sleep 3; done'
          echo "Kratos ready."

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for devguard-api..."
          timeout 120 bash -c 'until curl -sf http://localhost:8080/api/v1/health/ > /dev/null 2>&1; do sleep 3; done'
          echo "Backend ready."

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend dev server..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 3; done'
          echo "Frontend ready."

      - name: Run E2E tests
        run: |
          docker run --rm \
            --network host \
            -v ${{ github.workspace }}:/work \
            -w /work \
            -u $(id -u):$(id -g) \
            -e CI=true \
            -e HOME=/tmp \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 \
            npm run e2e